apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-unnecessary-ingress
  namespace: ml-quality
spec:
  podSelector:
    matchLabels: {app: inspection-ml-api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ml-quality}
      ports:
        - {protocol: TCP, port: 8765}
# Requires a CNI configured to enforce Kubernetes NetworkPolicy. The AWS VPC CNI
# does not enforce these by default; validate network policy mode before rollout.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-platform-worker
  namespace: ml-quality
spec:
  replicas: 2
  selector:
    matchLabels: {app: ml-platform-worker}
  template:
    metadata:
      labels: {app: ml-platform-worker}
    spec:
      serviceAccountName: ml-platform-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          ports:
            - {name: metrics, containerPort: 9100}
          readinessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 20
          image: REPLACE_WITH_APPROVED_ECR_IMAGE_DIGEST
          env:
            - {name: APP_ENV, value: production}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ml-database, key: url}}
            - name: TENANT_NAMESPACE_MAP
              valueFrom: {configMapKeyRef: {name: ml-platform-config, key: tenant_namespace_map}}
            - name: MLFLOW_TRACKING_URI
              valueFrom: {configMapKeyRef: {name: ml-platform-config, key: mlflow_uri}}
            - name: TRAINING_DATASET_BUCKET
              valueFrom: {configMapKeyRef: {name: ml-platform-config, key: training_dataset_bucket}}
            - name: RAY_RUNTIME_VERSION
              valueFrom: {configMapKeyRef: {name: ml-platform-config, key: ray_runtime_version}}
            - name: AWS_ACCOUNT_ID
              valueFrom: {configMapKeyRef: {name: ml-platform-config, key: aws_account_id}}
            - name: AWS_REGION
              valueFrom: {configMapKeyRef: {name: ml-platform-config, key: aws_region}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: ml-platform-worker-metrics
  namespace: ml-quality
  labels: {app: ml-platform-worker}
spec:
  type: ClusterIP
  selector: {app: ml-platform-worker}
  ports:
    - {name: metrics, port: 9100, targetPort: metrics}

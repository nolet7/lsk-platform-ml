apiVersion: batch/v1
kind: Job
metadata:
  name: synthetic-inspection-train
  namespace: ml-quality
  labels:
    app: lsk-ml-train
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: lsk-ml-train
    spec:
      serviceAccountName: default # Replace with dedicated workload identity before deployment
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: train
          image: REPLACE_WITH_APPROVED_ECR_IMAGE_DIGEST
          command: ["python", "-m", "ml.train"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # training writes artifacts; replace with mounted ephemeral volume
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

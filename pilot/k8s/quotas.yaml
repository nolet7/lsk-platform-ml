apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-team-quota
  namespace: ml-quality
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "20"
    count/jobs.batch: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ml-workload-limits
  namespace: ml-quality
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      default:
        cpu: "2"
        memory: 2Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-team-quota
  namespace: ml-repair
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "20"
    count/jobs.batch: "10"

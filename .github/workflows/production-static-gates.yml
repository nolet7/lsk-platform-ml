name: Production blueprint static gates
on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=production/terraform fmt -check
      - run: terraform -chdir=production/terraform init -backend=false
      - run: terraform -chdir=production/terraform validate
# No deploy job by design. Do not enable GitOps auto-sync until production authorization.

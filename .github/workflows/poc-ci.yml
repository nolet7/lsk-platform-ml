name: POC Python checks
on:
  push:
    branches: [poc, pilot, production]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit and integration checks
        run: python -m pytest -q
      - name: Reproducible synthetic training
        run: python -m ml.train

name: ML platform control plane checks
on:
  pull_request:
    branches: [production]
  push:
    branches: [feature/ml-deployment-platform-control-plane]
permissions:
  contents: read
jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and policy tests
        run: python -m pytest -q
      - name: Build separate ML platform API image
        run: docker build --pull -f mlplatform/Dockerfile -t mlplatform:ci .
      - name: Validate synthetic example image
        run: docker build --pull -t aerospace-model-example:ci .

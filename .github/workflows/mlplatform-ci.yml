name: ML platform control plane checks
on:
  pull_request:
    branches: [production, feature/ml-deployment-platform-control-plane]
  push:
    branches: [feature/ml-deployment-platform-control-plane, feature/enterprise-ml-platform-completion]
permissions:
  contents: read
jobs:
  platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and policy tests
        run: python -m pytest -q
      - name: Build separate ML platform API image
        run: docker build --pull -f mlplatform/Dockerfile -t mlplatform:ci .
      - name: Build reconciliation worker
        run: docker build --pull -f mlplatform/worker.Dockerfile -t mlplatform-worker:ci .
      - name: Validate synthetic example image
        run: docker build --pull -f examples/sklearn_inference/Dockerfile -t aerospace-model-example:ci .
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mlplatform_ci
          POSTGRES_USER: mlplatform_ci
          POSTGRES_PASSWORD: ci-only-not-production
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mlplatform_ci -d mlplatform_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL_TEST: postgresql://mlplatform_ci:ci-only-not-production@127.0.0.1:5432/mlplatform_ci
      PGPASSWORD: ci-only-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Apply both metadata migrations
        run: |
          psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 -f production/db/002_platform_control_plane.sql
          psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 -f production/db/003_reconciliation.sql
          psql "$DATABASE_URL_TEST" -v ON_ERROR_STOP=1 -f production/db/004_training_jobs.sql
      - name: PostgreSQL-backed platform tests
        run: python -m pytest -q tests/integration/test_postgres_registry.py
